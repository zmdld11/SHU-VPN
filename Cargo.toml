[workspace]
resolver = "2"
members = ["crates/shuvpn-core", "crates/probe", "src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "process",
  "io-util",
  "net",
  "signal",
] }
async-trait = "0.1"
log = "0.4"
regex = "1"
