name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: |
          npm install
          npm install --prefix ui

      # 取件官方 OpenVPN MSI 作为内嵌前置依赖（未装 OpenVPN 的机器上应用可一键静默安装）。
      # 来源按序回退：本仓库 vendor release（首选，CDN 抖动时最稳）→ 官方 swupdate CDN。
      # 用文件魔数（OLE2 头 D0 CF 11 E0）+ 体积校验，杜绝拿到 HTML 错误页；版本升级改
      # OPENVPN_MSI_VERSION 即可。
      - name: Fetch embedded OpenVPN MSI
        env:
          OPENVPN_MSI_VERSION: "2.7.9-I002"
          VENDOR_MSI_URL: "https://github.com/zmdld11/SHU-VPN/releases/download/vendor-openvpn-2.7.9/OpenVPN-2.7.9-I002-amd64.msi"
          # 官方原包指纹锁定（OpenVPN Inc Authenticode 签名 + 本哈希双重校验）
          VENDOR_MSI_SHA256: "D050EFADC6CABC4E304EB810DD7FEDFC54B859D34730AB9CDCB22D61EB86AB7A"
        shell: pwsh
        run: |
          $version = $env:OPENVPN_MSI_VERSION
          $out = "src-tauri/resources/openvpn-prereq.msi"
          $urls = @(
            $env:VENDOR_MSI_URL,
            "https://swupdate.openvpn.org/community/releases/OpenVPN-$version-amd64.msi",
            "https://swupdate.openvpn.net/community/releases/OpenVPN-$version-amd64.msi"
          )
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          $ok = $false
          foreach ($u in $urls) {
            Write-Host ">> trying $u"
            try {
              curl.exe -fsSL --retry 2 --connect-timeout 20 -A $ua -o $out $u
              if ($LASTEXITCODE -eq 0 -and (Test-Path $out)) {
                $len = (Get-Item $out).Length
                $bytes = [System.IO.File]::ReadAllBytes($out)
                $magic = (($bytes[0..3] | ForEach-Object { $_.ToString('X2') }) -join ' ')
                Write-Host ">> got $len bytes, magic=$magic"
                if ($len -gt 3000000 -and $magic -eq 'D0 CF 11 E0') { $ok = $true; break }
                Write-Host ">> 内容不是 MSI（HTML 错误页或体积异常），换下一个来源"
              } else {
                Write-Host ">> curl 退出码 $LASTEXITCODE"
              }
            } catch { Write-Host ">> failed: $_" }
          }
          if (-not $ok) { throw "未能获取 OpenVPN $version MSI：所有来源均失败（检查 vendor release 是否存在 / CDN 状态）" }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($env:VENDOR_MSI_SHA256 -and $hash -ne $env:VENDOR_MSI_SHA256) {
            throw "MSI sha256 不匹配：期望 $($env:VENDOR_MSI_SHA256)，实际 $hash（文件可能被替换或损坏，禁止内嵌）"
          }
          "$hash  openvpn-prereq.msi (OpenVPN $version)" | Out-File -Encoding ascii "src-tauri/resources/openvpn-prereq.msi.sha256"
          Write-Host "Fetched OpenVPN $version MSI, sha256=$hash"

      - name: Build & bundle (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "SHU-VPN v__VERSION__"
          releaseBody: "下载 SHU-VPN_x.y.z_x64-setup.exe 安装。未安装 OpenVPN 社区版时，应用内置官方安装包可一键安装；已装版本则直接复用。"
          releaseDraft: true
          prerelease: false
